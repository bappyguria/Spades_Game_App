name: app
description: "A new Flutter project."
version: 1.0.0+1

environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core:
  cloud_firestore:
  firebase_auth:
  uuid:
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  rename_app:

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true

  assets:
    - assets/images/



flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Spades_logo.png"

